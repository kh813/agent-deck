name: "test"

# Runs every test suite on BOTH macOS and Windows for each push to main (and
# on demand). Platform-specific behavior -- file locking, PowerShell skill
# builds, CRLF/encoding, path handling -- is verified here instead of by hand
# on each OS. Separate from release.yml so a red run never blocks a tag, but
# a tag should only be cut from a green commit.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies (debug/test profile) from the previous run on
      # main; saved only from main so PR runs can't evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: test-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install frontend dependencies
        run: npm install

      - name: frontend tests (vitest)
        run: npx vitest run

      - name: typecheck
        run: npx tsc --noEmit

      - name: python tests (pytest)
        shell: bash
        run: |
          python -m venv .ci-test-venv
          if [ -x .ci-test-venv/Scripts/python.exe ]; then PY=.ci-test-venv/Scripts/python.exe; else PY=.ci-test-venv/bin/python; fi
          "$PY" -m pip install -q --upgrade pip
          "$PY" -m pip install -q pytest
          "$PY" -m pytest python/tests/ -v

      - name: rust tests (cargo)
        working-directory: src-tauri
        env:
          # Windows only has an effect there: see src-tauri/build.rs.
          AGENT_DECK_EMBED_TEST_MANIFEST: "1"
        run: cargo test --lib

      # The real app's native menu bar on this OS (menus can't be built in
      # unit tests): build the debug binary and let python/tests/
      # test_menu_layout.py launch it with AGENT_DECK_DUMP_MENU=1.
      - name: menu layout (real app)
        shell: bash
        env:
          AGENT_DECK_EMBED_TEST_MANIFEST: "1"
        run: |
          (cd src-tauri && cargo build)
          if [ -f src-tauri/target/debug/agent-deck.exe ]; then BIN=src-tauri/target/debug/agent-deck.exe; else BIN=src-tauri/target/debug/agent-deck; fi
          if [ -x .ci-test-venv/Scripts/python.exe ]; then PY=.ci-test-venv/Scripts/python.exe; else PY=.ci-test-venv/bin/python; fi
          AGENT_DECK_BIN="$PWD/$BIN" "$PY" -m pytest python/tests/test_menu_layout.py -v
